databases:
  - name: assetpulse-db
    databaseName: assetpulse
    user: assetpulse
    plan: free

services:
  - type: web
    name: assetpulse
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: DATABASE_URL
        fromDatabase:
          name: assetpulse-db
          property: connectionString
      - key: APP_URL
        sync: false          # e.g. https://assetpulse.app
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: AssetPulse
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
